<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Brix Pizza</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>🍕 Brix Pizza</h1>
            <p class="tagline">Brick oven perfection, delivered to your door</p>
        </header>

        <div class="auth-form">
            <h2>Login</h2>

            {{if .Error}}
                <div class="error-message">{{.Error}}</div>
            {{end}}

            <form action="/login" method="POST">
                <div class="form-group">
                    <label for="email">Email Address:</label>
                    <input type="email" id="email" name="email" required maxlength="100" title="Please enter your email address">
                </div>

                <div class="form-group">
                    <label for="password">Password:</label>
                    <input type="password" id="password" name="password" required minlength="6" maxlength="100" title="Please enter your password">
                </div>

                <button type="submit" class="btn-submit">Login</button>
            </form>

            <p class="auth-link">Don't have an account? <a href="/register">Register here</a></p>
        </div>
    </div>
</body>
</html>
