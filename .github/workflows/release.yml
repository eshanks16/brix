name: Release

# Triggers when a GitHub Release is published.
# The release tag (e.g. v1.1.0) becomes the container image tag.
#
# Required repository secrets:
#   QUAY_USERNAME  — Quay.io robot account username
#   QUAY_PASSWORD  — Quay.io robot account password / token
#
# Add them at: Settings → Secrets and variables → Actions → New repository secret
on:
  release:
    types: [published]

env:
  IMAGE: quay.io/rh-ee-eshanks/brix-pizza

jobs:
  build-push:
    name: Build and push container image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Quay.io
        uses: docker/login-action@v3
        with:
          registry: quay.io
          username: ${{ secrets.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_PASSWORD }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # Tags the image with the GitHub release tag (e.g. v1.1.0) and
          # also updates :latest so deployments using that tag stay current.
          tags: |
            ${{ env.IMAGE }}:${{ github.event.release.tag_name }}
            ${{ env.IMAGE }}:latest
