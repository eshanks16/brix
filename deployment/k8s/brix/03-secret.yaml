# ⚠️  DEMO CREDENTIALS - CHANGE FOR PRODUCTION!
#
# IMPORTANT — two sections are used here intentionally:
#
#   data:        values must be base64-encoded.
#                Use: echo -n "value" | base64
#
#   stringData:  values are plain text — Kubernetes encodes them automatically.
#                Use this for tokens you copy-paste from oc/kubectl output.
#
# Current demo values:
#   API Key: "demo-api-key-change-in-production"
#
# To generate secure production credentials:
#   oc create secret generic brix-pizza-secrets \
#     --from-literal=api-key=$(openssl rand -hex 32) \
#     --from-literal=chatbot-token=<your-token> \
#     -n brix

apiVersion: v1
kind: Secret
metadata:
  name: brix-pizza-secrets
  namespace: brix
type: Opaque
data:
  # Pre-encoded demo value = "demo-api-key-change-in-production"
  # FOR PRODUCTION: echo -n "$(openssl rand -hex 32)" | base64
  api-key: ZGVtby1hcGkta2V5LWNoYW5nZS1pbi1wcm9kdWN0aW9u

stringData:
  # Paste the raw bearer token here — no base64 encoding needed.
  # Obtain with: oc create token <service-account> -n <namespace>
  chatbot-token: ""
