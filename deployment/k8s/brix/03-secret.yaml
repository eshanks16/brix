metadata:
  name: brix-pizza-secrets
  namespace: brix
type: Opaque
data:
  # api-key: Demo value = "demo-api-key-change-in-production"
  # FOR PRODUCTION: Generate with: openssl rand -hex 32 | base64
  api-key: ZGVtby1hcGkta2V5LWNoYW5nZS1pbi1wcm9kdWN0aW9u

  # chatbot-token: Bearer token for the inference server (base64-encoded).
  # Obtain from: oc create token <sa> -n <namespace>
  # Then encode:  echo -n "<token>" | base64
  chatbot-token: ""
