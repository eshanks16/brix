apiVersion: apps/v1
kind: Deployment
metadata:
  name: brix-pizza
  namespace: brix
  labels:
    app: brix-pizza
spec:
  replicas: 3
  selector:
    matchLabels:
      app: brix-pizza
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1
  template:
    metadata:
      labels:
        app: brix-pizza
    spec:
      containers:
      - name: brix-pizza
        image: eshanks16/brix-pizza:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8080
          name: http
          protocol: TCP
        env:
        - name: PORT
          valueFrom:
            configMapKeyRef:
              name: brix-pizza-config
              key: PORT
        - name: BRIX_API_KEY
          valueFrom:
            secretKeyRef:
              name: brix-pizza-secrets
              key: api-key
              optional: true
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: mysql-secrets
              key: connection-string
              optional: true
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
        livenessProbe:
          httpGet:
            path: /health/live
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health/ready
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        securityContext:
          runAsNonRoot: true
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: false
          capabilities:
            drop:
            - ALL
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: brix-pizza-pdb
  namespace: brix
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: brix-pizza
