apiVersion: v1
kind: ConfigMap
metadata:
  name: mysql-init
  namespace: brix
data:
  # This SQL script runs automatically when MySQL first starts
  init.sql: |
    USE brix_pizza;

    -- Users table
    CREATE TABLE IF NOT EXISTS users (
        id INT AUTO_INCREMENT PRIMARY KEY,
        first_name VARCHAR(100) NOT NULL,
        last_name VARCHAR(100) NOT NULL,
        email VARCHAR(255) NOT NULL UNIQUE,
        phone VARCHAR(20),
        password VARCHAR(255) NOT NULL,
        created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP,
        INDEX idx_email (email)
    ) ENGINE=InnoDB DEFAULT CHARSET=utf8mb4 COLLATE=utf8mb4_unicode_ci;

    -- Pizza styles table
    CREATE TABLE IF NOT EXISTS pizza_styles (
        id INT AUTO_INCREMENT PRIMARY KEY,
        name VARCHAR(100) NOT NULL UNIQUE,
        description TEXT,
        emoji VARCHAR(10)
    ) ENGINE=InnoDB DEFAULT CHARSET=utf8mb4 COLLATE=utf8mb4_unicode_ci;

    -- Pizza sizes table
    CREATE TABLE IF NOT EXISTS pizza_sizes (
        id INT AUTO_INCREMENT PRIMARY KEY,
        name VARCHAR(50) NOT NULL UNIQUE,
        diameter VARCHAR(20),
        base_price DECIMAL(10,2) NOT NULL
    ) ENGINE=InnoDB DEFAULT CHARSET=utf8mb4 COLLATE=utf8mb4_unicode_ci;

    -- Toppings table
    CREATE TABLE IF NOT EXISTS toppings (
        id INT AUTO_INCREMENT PRIMARY KEY,
        name VARCHAR(100) NOT NULL UNIQUE,
        price DECIMAL(10,2) NOT NULL,
        category VARCHAR(50)
    ) ENGINE=InnoDB DEFAULT CHARSET=utf8mb4 COLLATE=utf8mb4_unicode_ci;

    -- Orders table
    CREATE TABLE IF NOT EXISTS orders (
        id INT AUTO_INCREMENT PRIMARY KEY,
        user_id INT NOT NULL,
        pizza_style VARCHAR(100) NOT NULL,
        size VARCHAR(50) NOT NULL,
        left_toppings TEXT,
        right_toppings TEXT,
        whole_toppings TEXT,
        total DECIMAL(10,2) NOT NULL,
        status VARCHAR(20) DEFAULT 'pending',
        created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP,
        FOREIGN KEY (user_id) REFERENCES users(id) ON DELETE CASCADE,
        INDEX idx_user_id (user_id),
        INDEX idx_created_at (created_at)
    ) ENGINE=InnoDB DEFAULT CHARSET=utf8mb4 COLLATE=utf8mb4_unicode_ci;

    -- Insert pizza styles
    INSERT INTO pizza_styles (name, description, emoji) VALUES
    ('New York Style', 'Thin, crispy crust with a perfect fold', '🗽'),
    ('Chicago Deep Dish', 'Thick, buttery crust with layers of toppings', '🏙️'),
    ('Neapolitan', 'Traditional Italian with San Marzano tomatoes', '🇮🇹'),
    ('Detroit Style', 'Square pizza with crispy, cheesy edges', '🚗'),
    ('Sicilian', 'Thick, spongy crust baked in a rectangular pan', '🌋')
    ON DUPLICATE KEY UPDATE description=VALUES(description), emoji=VALUES(emoji);

    -- Insert pizza sizes
    INSERT INTO pizza_sizes (name, diameter, base_price) VALUES
    ('Small', '10"', 8.99),
    ('Medium', '12"', 11.99),
    ('Large', '14"', 14.99),
    ('X-Large', '16"', 17.99)
    ON DUPLICATE KEY UPDATE diameter=VALUES(diameter), base_price=VALUES(base_price);

    -- Insert toppings
    INSERT INTO toppings (name, price, category) VALUES
    ('Pepperoni', 1.50, 'meat'),
    ('Italian Sausage', 1.50, 'meat'),
    ('Ham', 1.50, 'meat'),
    ('Bacon', 1.75, 'meat'),
    ('Ground Beef', 1.50, 'meat'),
    ('Chicken', 2.00, 'meat'),
    ('Mushrooms', 1.00, 'vegetable'),
    ('Bell Peppers', 1.00, 'vegetable'),
    ('Onions', 1.00, 'vegetable'),
    ('Black Olives', 1.00, 'vegetable'),
    ('Tomatoes', 1.00, 'vegetable'),
    ('Spinach', 1.25, 'vegetable'),
    ('Pineapple', 1.25, 'vegetable'),
    ('Jalapeños', 1.00, 'vegetable'),
    ('Extra Cheese', 1.50, 'cheese'),
    ('Feta Cheese', 1.75, 'cheese'),
    ('Parmesan', 1.50, 'cheese')
    ON DUPLICATE KEY UPDATE price=VALUES(price), category=VALUES(category);
