# TEMPLATE: Replace placeholder values before deploying
# This file contains sensitive information and should NOT be committed to version control
#
# To create the secret using kubectl (recommended):
#   kubectl create secret generic brix-pizza-secrets \
#     --from-literal=api-key=YOUR_BRIX_API_KEY \
#     --from-literal=database-url=mysql_user:mysql_pass@tcp(mysql-host:3306)/brix_pizza \
#     -n brix
#
# Or encode values manually:
#   echo -n "your-secret-value" | base64

apiVersion: v1
kind: Secret
metadata:
  name: brix-pizza-secrets
  namespace: brix
type: Opaque
data:
  # api-key: API key for Brix Pizza REST API (BRIX_API_KEY environment variable)
  # This is the Bearer token users provide to access /api/* endpoints
  # Generate: openssl rand -hex 32
  # Then base64 encode: echo -n "YOUR_API_KEY" | base64
  api-key: REPLACE_WITH_BASE64_ENCODED_API_KEY

  # database-url: MySQL connection string (DATABASE_URL environment variable)
  # Format: mysql_username:mysql_password@tcp(mysql_host:3306)/database_name
  # Example: brix_user:secretPass123@tcp(mysql.default.svc.cluster.local:3306)/brix_pizza
  # Base64 encode: echo -n "user:pass@tcp(host:3306)/db" | base64
  database-url: REPLACE_WITH_BASE64_ENCODED_DATABASE_URL
